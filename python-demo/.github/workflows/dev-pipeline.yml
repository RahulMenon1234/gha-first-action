name: dev pipeline
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: get code
        uses: action/checkout@v7
      - name: setup python
        uses: action/setup-python@v7
        with:
          python-version: '3.12'

      - name: build
        run:  python -m compileall src

      - name: test
        run: python -m unittest discover -s tests -v